<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><title>Agent workspace for materials research</title><desc>Raw instrument files (ZEM, LFA, XRD) flow into a command-line agent workspace, which returns fitted figures and traceable Markdown and JSON reports.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#52756c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#23493f}.label{font-size:12px;letter-spacing:1.3px;font-weight:700}.small{font-size:13px;fill:#5d736b}.mono{font-family:Consolas,Menlo,monospace;font-size:12.5px;fill:#d6e2e6}.prompt{fill:#7fd8cb}.file{font-size:12px;font-weight:700}.arrow{fill:none;stroke:#52756c;stroke-width:2;marker-end:url(#arrow)}</style>
