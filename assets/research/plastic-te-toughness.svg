  <path d="M172 204.6H188" stroke="#eceef1" stroke-width="2.2"/>
  <path class="disl" d="M155 166h10M160 166v-8 M195 161h10M200 161v-8 M159 187h10M164 187v-8 M193 185h10M198 185v-8 M175 154h10M180 154v-8" opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.58;0.88;1" values="0;1;1;0;0"/></path>
</g>
<g transform="translate(0 -6)"><animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.58;0.88;1" values="0 -6;0 3;0 3;0 -6;0 -6"/>
  <path d="M180 86V141" class="load"/><text x="192" y="104" class="tiny" style="fill:#96501f">F</text>
</g></g>
<g class="still">
<g clip-path="url(#beamclip)">
  <path class="metal" d="M50 148Q180 154 310 148V204Q180 210 50 204Z"></path>
  <path d="M58 152Q180 158 302 152" fill="none" stroke="#fff" stroke-width="1.3" opacity=".5"></path>
  
</g>
<g transform="translate(0 3)">
  <circle cx="180" cy="170" r="30" fill="url(#zone)" opacity="1"></circle>
  <path d="M171.5 205L180 186L188.5 205Z" fill="#eceef1" stroke="#0c0f12" stroke-linejoin="round"/>
  <path d="M180 188V172" stroke="#eceef1" stroke-width="2.4"/><circle cx="180" cy="171" r="3.3" fill="#eceef1" stroke="#0c0f12" stroke-width=".8"/>
  <path d="M172 204.6H188" stroke="#eceef1" stroke-width="2.2"/>
  <path class="disl" d="M155 166h10M160 166v-8 M195 161h10M200 161v-8 M159 187h10M164 187v-8 M193 185h10M198 185v-8 M175 154h10M180 154v-8" opacity="1"></path>
</g>
