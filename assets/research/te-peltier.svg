<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 225" role="img" aria-labelledby="title desc">
  <title id="title">Peltier cooling</title><desc id="desc">A direct-current supply drives a thermoelectric p–n couple. Heat Q c is absorbed at the cold side; heat Q h is rejected at the hot side.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#527b68"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="13" fill="#476353">
    <path d="M228 10V44" stroke="#517d99" stroke-width="5"/><path d="M220 36L228 47L236 36" fill="none" stroke="#517d99" stroke-width="3"/>
    <text x="249" y="28">Q<tspan baseline-shift="sub" font-size="10">c</tspan> absorbed</text>
    <rect x="137" y="48" width="182" height="13" rx="3" fill="#b6d2dd"/>
    <path d="M181 66H275" stroke="#ba8a62" stroke-width="5"/>
    <rect x="166" y="68" width="30" height="70" rx="2" fill="#337b67"/><rect x="260" y="68" width="30" height="70" rx="2" fill="#678b9d"/>
    <text x="181" y="110" text-anchor="middle" fill="white" font-size="20">p</text><text x="275" y="110" text-anchor="middle" fill="white" font-size="20">n</text>
    <path d="M160 141H202M254 141H296" stroke="#ba8a62" stroke-width="5"/>
    <rect x="137" y="146" width="182" height="13" rx="3" fill="#dbb18d"/>
    <path d="M181 141V199H204M275 141V199H252" fill="none" stroke="#527b68" stroke-width="1.8"/>
    <rect x="204" y="183" width="48" height="30" rx="15" fill="#f9fcf5" stroke="#527b68"/>
    <text x="228" y="203" text-anchor="middle" font-weight="bold">DC</text><text x="185" y="182" font-size="11">+</text><text x="262" y="182" font-size="11">−</text>
    <path d="M156 179V161" stroke="#527b68" stroke-width="1.5" marker-end="url(#a)"/><text x="145" y="177" font-style="italic">I</text>
    <text x="119" y="58" text-anchor="end">Cold side T<tspan baseline-shift="sub" font-size="10">c</tspan></text>
    <text x="119" y="156" text-anchor="end">Hot side T<tspan baseline-shift="sub" font-size="10">h</tspan></text>
    <path d="M336 152V191" stroke="#b97646" stroke-width="5"/><path d="M328 181L336 193L344 181" fill="none" stroke="#b97646" stroke-width="3"/>
    <text x="350" y="173">Q<tspan baseline-shift="sub" font-size="10">h</tspan> rejected</text>
    <text x="319" y="107" font-size="11" fill="#607668">Heat pumping</text><path d="M233 83V125" stroke="#527b68" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
</svg>
