<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260"><title>Seebeck effect</title><desc>Heat flow from hot to cold supplies electrical power to a load. Conceptual p–n couple.</desc>
<g font-family="Arial, sans-serif" font-size="14" fill="#476353">
<path d="M160 13V45M152 37L160 48L168 37" fill="none" stroke="#b97646" stroke-width="3"/>
<text x="181" y="28">Q<tspan baseline-shift="sub" font-size="11">h</tspan> supplied</text>
<text x="7" y="64">Hot T<tspan baseline-shift="sub" font-size="11">h</tspan></text>
<rect x="100" y="53" width="120" height="13" rx="3" fill="#dbb18d"/>
<path d="M130 72H190" stroke="#ba8a62" stroke-width="5"/>
<rect x="118" y="75" width="24" height="75" rx="2" fill="#337b67"/><rect x="178" y="75" width="24" height="75" rx="2" fill="#678b9d"/>
<text x="130" y="118" text-anchor="middle" fill="white" font-size="20">p</text><text x="190" y="118" text-anchor="middle" fill="white" font-size="20">n</text>
<path d="M112 154H148M172 154H208" stroke="#ba8a62" stroke-width="5"/>
<rect x="100" y="162" width="120" height="13" rx="3" fill="#b6d2dd"/>
<text x="7" y="173">Cold T<tspan baseline-shift="sub" font-size="11">c</tspan></text>
<path d="M160 92V137M155 130L160 138L165 130" fill="none" stroke="#698375" stroke-width="1.5"/>
<path d="M130 154V229H140M190 154V229H180" fill="none" stroke="#698375" stroke-width="1.8"/>
<rect x="137" y="213" width="46" height="30" rx="4" fill="#fffdf4" stroke="#698375"/>
<text x="160" y="234" text-anchor="middle" font-size="13">Load</text>
<path d="M237 165V203M229 194L237 205L245 194" fill="none" stroke="#517d99" stroke-width="3"/>
<text x="254" y="187">Q<tspan baseline-shift="sub" font-size="11">c</tspan></text><text x="224" y="228" font-size="12">rejected</text>
</g></svg>
