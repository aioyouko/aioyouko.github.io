<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 225" role="img" aria-labelledby="title desc">
  <title id="title">Seebeck power generation</title><desc id="desc">Heat Q h enters a thermoelectric couple from a hot source. Part of the energy supplies an electrical load, and the remaining heat Q c leaves through the cold side.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a36a3f"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b634e">
    <path d="M228 10V44" stroke="#b97646" stroke-width="5"/><path d="M220 36L228 47L236 36" fill="none" stroke="#b97646" stroke-width="3"/>
    <text x="249" y="28">Q<tspan baseline-shift="sub" font-size="10">h</tspan> supplied</text>
    <rect x="137" y="48" width="182" height="13" rx="3" fill="#dbb18d"/>
    <path d="M181 66H275" stroke="#ba8a62" stroke-width="5"/>
    <rect x="166" y="68" width="30" height="70" rx="2" fill="#337b67"/><rect x="260" y="68" width="30" height="70" rx="2" fill="#678b9d"/>
    <text x="181" y="110" text-anchor="middle" fill="white" font-size="20">p</text><text x="275" y="110" text-anchor="middle" fill="white" font-size="20">n</text>
    <path d="M160 141H202M254 141H296" stroke="#ba8a62" stroke-width="5"/>
    <rect x="137" y="146" width="182" height="13" rx="3" fill="#b6d2dd"/>
    <path d="M181 141V199H202M275 141V199H254" fill="none" stroke="#a36a3f" stroke-width="1.8"/>
    <rect x="202" y="183" width="52" height="30" rx="4" fill="#fffaf0" stroke="#a36a3f"/><text x="228" y="203" text-anchor="middle">Load</text>
    <path d="M187 177V192" stroke="#a36a3f" stroke-width="1.5" marker-end="url(#a)"/><text x="197" y="178" font-style="italic">I</text>
    <text x="119" y="58" text-anchor="end">Hot side T<tspan baseline-shift="sub" font-size="10">h</tspan></text>
    <text x="119" y="156" text-anchor="end">Cold side T<tspan baseline-shift="sub" font-size="10">c</tspan></text>
    <path d="M336 152V191" stroke="#517d99" stroke-width="5"/><path d="M328 181L336 193L344 181" fill="none" stroke="#517d99" stroke-width="3"/>
    <text x="350" y="173">Q<tspan baseline-shift="sub" font-size="10">c</tspan> rejected</text>
    <text x="319" y="107" font-size="11" fill="#776f5b">Heat flow</text><path d="M233 83V125" stroke="#a36a3f" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
</svg>
