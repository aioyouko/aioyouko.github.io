<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><title>TE-PlotBench: from scientific figures to checked records</title><desc>A published thermoelectric figure is read point by point into a structured record, whose values are then checked for physical consistency, for example that the power factor equals S squared times sigma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#52756c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#23493f}.label{font-size:12px;letter-spacing:1.3px;font-weight:700}.small{font-size:13px;fill:#5d736b}.mono{font-family:Consolas,Menlo,monospace;font-size:12px;fill:#d6e2e6}.k{fill:#7fd8cb}.s{fill:#f2c78a}.n{fill:#9cc4ff}.arrow{fill:none;stroke:#52756c;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="32" y="43" class="label">PUBLISHED FIGURE</text><text x="320" y="43" text-anchor="middle" class="label">STRUCTURED RECORD</text><text x="608" y="43" text-anchor="end" class="label">PHYSICS CHECK</text>
